<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VR World Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#080808;overflow:hidden}
body{display:grid;place-items:center}#reset{position:fixed;top:12px;right:12px;width:42px;height:42px;border:2px solid #aaa;border-radius:8px;background:#111;color:#fff;font:700 22px monospace;cursor:pointer;z-index:10}#reset:hover{background:#222}
#stage{width:min(82vmin,720px);height:min(82vmin,720px);background:#111;border:2px solid #666;border-radius:12px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
</style>
</head>
<body>
<button id="reset" type="button" aria-label="Reset simulation">R</button>
<div id="stage"><canvas id="preview"></canvas></div>
<script src="simulation.js"></script>
<script>
(function(){
  const stage=document.getElementById("stage");
  const canvas=document.getElementById("preview");
  const ctx=canvas.getContext("2d");
  const resetButton=document.getElementById("reset");
  const world=window.VRWorld;
  const colors=window.VRWorldColors;
  const drawColors={
    meta:normalizeColor(colors.meta),
    spike:normalizeColor(colors.spike),
    glitch:normalizeColor(colors.glitch)
  };

  let lastTime=performance.now();
  let initialized=false;
  let viewWidth=0;
  let viewHeight=0;
  let resizeQueued=false;
  let nextPeriodicSave=5;

  function normalizeColor(color){
    const match=/^#([0-9a-f]{8})$/i.exec(color||"");
    if(!match)return color;
    const hex=match[1];
    const r=parseInt(hex.slice(0,2),16);
    const g=parseInt(hex.slice(2,4),16);
    const b=parseInt(hex.slice(4,6),16);
    const a=parseInt(hex.slice(6,8),16)/255;
    return "rgba("+r+", "+g+", "+b+", "+a+")";
  }

  function resize(){
    const rect=stage.getBoundingClientRect();
    const width=rect.width;
    const height=rect.height;
    if(width<1||height<1)return false;

    const d=Math.min(window.devicePixelRatio||1,2);
    const pixelWidth=Math.max(1,Math.round(width*d));
    const pixelHeight=Math.max(1,Math.round(height*d));

    if(canvas.width!==pixelWidth||canvas.height!==pixelHeight){
      canvas.width=pixelWidth;
      canvas.height=pixelHeight;
    }

    viewWidth=width;
    viewHeight=height;
    canvas.style.width=width+"px";
    canvas.style.height=height+"px";
    ctx.setTransform(d,0,0,d,0,0);
    world.setBounds(width,height);
    return true;
  }

  function requestResize(){
    if(resizeQueued)return;
    resizeQueued=true;
    requestAnimationFrame(()=>{
      resizeQueued=false;
      resize();
    });
  }

  function drawSpike(entity,color){const count=world.spikePointCount?world.spikePointCount(entity):3;ctx.beginPath();for(let i=0;i<count;i++){const a=(entity.direction||0)+Math.PI*2*i/count,x=entity.x+Math.cos(a)*entity.radius,y=entity.y+Math.sin(a)*entity.radius;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.closePath();ctx.fillStyle=color;ctx.fill();}

  function drawCircle(entity,color){
    if(!entity)return;
    ctx.beginPath();
    ctx.arc(entity.x,entity.y,entity.radius,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
  }

  function draw(){
    if(viewWidth<1||viewHeight<1)return;

    ctx.clearRect(0,0,viewWidth,viewHeight);
    ctx.fillStyle="#111";
    ctx.fillRect(0,0,viewWidth,viewHeight);

    for(const entity of world.metaballs)drawMetaball(entity);
    for(const entity of world.spikes)drawSpike(entity,drawColors.spike);
    for(const entity of world.glitches)drawCircle(entity,drawColors.glitch);
    drawPlayer();
    if(world.player&&world.player.captured)drawPlayerTrap();
  }

  function drawPlayer(){
    const player=world.player;if(!player)return;
    const size=Math.max(7,player.radius*.7);
    ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.heading||0);ctx.beginPath();ctx.moveTo(0,-size);ctx.lineTo(size,0);ctx.lineTo(0,size);ctx.lineTo(-size,0);ctx.closePath();ctx.fillStyle="#3b82f6";ctx.fill();ctx.restore();
    ctx.fillStyle="#fff";ctx.font="700 12px monospace";ctx.textAlign="center";ctx.textBaseline="bottom";ctx.fillText(String(player.xp),player.x,player.y-size-4);
  }

  function drawPlayerTrap(){
    const trap=world.player&&world.player.trap;if(!trap||!trap.active)return;
    ctx.fillStyle="rgba(0,0,0,.94)";ctx.fillRect(0,0,viewWidth,viewHeight);
    const center=trap.center;
    ctx.save();ctx.lineWidth=2;ctx.shadowBlur=12;ctx.shadowColor="#ffffff";ctx.strokeStyle="#ffffff";ctx.fillStyle="#ffffff";
    for(const point of trap.points){ctx.beginPath();ctx.moveTo(point.x,point.y);ctx.lineTo(center.x,center.y);ctx.stroke();ctx.beginPath();ctx.arc(point.x,point.y,point.sealed?4:3,0,Math.PI*2);ctx.fill();}
    ctx.beginPath();ctx.arc(center.x,center.y,6,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.fillStyle="#fff";ctx.font="700 12px monospace";ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText("REPAIR",center.x,Math.min(viewHeight-14,center.y+14));
  }

  function drawMetaball(entity){
    drawCircle(entity,drawColors.meta);
    if(entity.pickup&&entity.pickup.storedXp>0){
      ctx.beginPath();
      ctx.arc(entity.x,entity.y,Math.max(3,entity.radius*.32),0,Math.PI*2);
      ctx.fillStyle="#000";
      ctx.fill();
    }
  }

  function getStorage(){
    try{return window.localStorage||null;}catch(error){return null;}
  }

  function resetSimulation(){
    const storage=getStorage();
    if(storage)world.clearPersistence(storage);
    world.resetPrototypeWorld();
    world.persistence.majorDirty=true;
    saveWorld();
    nextPeriodicSave=Math.floor(world.worldTime/5+1)*5;
    lastTime=performance.now();
  }

  function saveWorld(){
    const storage=getStorage();
    if(storage)world.savePersistence(storage);
  }

  function initialize(){
    if(initialized)return true;
    if(!resize())return false;
    const storage=getStorage();
    if(storage&&world.loadPersistence(storage))initialized=true;
    else initialized=world.resetPrototypeEntities();
    return initialized;
  }

  function loop(now){
    initialize();

    const dt=Math.max((now-lastTime)/1000,0);
    lastTime=now;

    if(initialized){
      world.step(dt);
      if(world.persistence.majorDirty||world.worldTime>=nextPeriodicSave){
        saveWorld();
        nextPeriodicSave=Math.floor(world.worldTime/5+1)*5;
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  resetButton.addEventListener("click",resetSimulation);
  addEventListener("resize",requestResize);
  addEventListener("pagehide",saveWorld);
  addEventListener("beforeunload",saveWorld);
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="hidden")saveWorld();
  });

  if("ResizeObserver" in window){
    new ResizeObserver(requestResize).observe(stage);
  }

  initialize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
