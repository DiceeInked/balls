<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VR World Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#080808;overflow:hidden}
body{display:grid;place-items:center}
#stage{width:min(82vmin,720px);height:min(82vmin,720px);background:#111;border:2px solid #666;border-radius:12px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="stage"><canvas id="preview"></canvas></div>
<script src="simulation.js"></script>
<script>
(function(){
  const stage=document.getElementById("stage");
  const canvas=document.getElementById("preview");
  const ctx=canvas.getContext("2d");
  const world=window.VRWorld;
  const colors=window.VRWorldColors;
  const radiusRatio=0.055;
  let lastTime=performance.now();
  let initialized=false;

  function getStageSize(){
    const rect=stage.getBoundingClientRect();
    return {width:rect.width,height:rect.height};
  }

  function resize(){
    const {width,height}=getStageSize();
    if(width<1||height<1)return false;

    const d=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.round(width*d));
    canvas.height=Math.max(1,Math.round(height*d));
    canvas.style.width=width+"px";
    canvas.style.height=height+"px";
    ctx.setTransform(d,0,0,d,0,0);
    world.setBounds(width,height);

    for(const e of world.metaballs.concat(world.spikes,world.glitches)){
      e.radius=Math.min(width,height)*radiusRatio;
      e.x=Math.max(e.radius,Math.min(width-e.radius,e.x));
      e.y=Math.max(e.radius,Math.min(height-e.radius,e.y));
    }
    return true;
  }

  function makeEntity(type,x,y,vx,vy){
    const {width,height}=getStageSize();
    const r=Math.min(width,height)*radiusRatio;
    return world.register({x,y,vx,vy,radius:r,xp:16},type);
  }

  function resetEntities(){
    const {width,height}=getStageSize();
    if(width<1||height<1)return false;

    for(const e of [...world.metaballs,...world.spikes,...world.glitches])world.unregister(e);

    makeEntity("metaball",width*.27,height*.35,82,57);
    makeEntity("spike",width*.52,height*.62,-71,64);
    makeEntity("glitch",width*.74,height*.38,-62,-79);
    world.setBounds(width,height);
    initialized=true;
    return true;
  }

  function drawCircle(entity,color){
    if(!entity)return;
    ctx.beginPath();
    ctx.arc(entity.x,entity.y,entity.radius,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
  }

  function draw(){
    const {width,height}=getStageSize();
    ctx.clearRect(0,0,width,height);
    ctx.fillStyle="#111";
    ctx.fillRect(0,0,width,height);
    for(const entity of world.metaballs)drawCircle(entity,colors.meta);
    for(const entity of world.spikes)drawCircle(entity,colors.spike);
    for(const entity of world.glitches)drawCircle(entity,colors.glitch);
  }

  function loop(now){
    if(!initialized){
      resize();
      resetEntities();
    }else{
      resize();
    }

    const dt=Math.min(Math.max((now-lastTime)/1000,0),0.05);
    lastTime=now;

    if(initialized)world.step(dt);
    draw();
    requestAnimationFrame(loop);
  }

  addEventListener("resize",()=>{resize();resetEntities();});
  resize();
  resetEntities();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
