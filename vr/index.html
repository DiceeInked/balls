<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VR World Preview</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;width:100%;height:100%;background:#080808;overflow:hidden}
body{display:grid;place-items:center}
button{font:700 18px monospace}
#stage{width:min(82vmin,720px);height:min(82vmin,720px);background:#111;border:2px solid #666;border-radius:12px;overflow:hidden;box-sizing:border-box}
#preview{width:100%;height:100%;display:block}
#controls{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:10}
.control{height:42px;padding:0 12px;border:2px solid #00ffc8;border-radius:8px;background:#111;color:#00ffc8;cursor:pointer}
.control:hover{background:#18201f}
.control:disabled{opacity:.45;cursor:wait}
#reset{border-color:#aaa;color:#fff}
#status{position:fixed;left:12px;bottom:12px;max-width:min(90vw,560px);padding:8px 10px;border:1px solid #555;border-radius:6px;background:rgba(0,0,0,.82);color:#fff;font:12px monospace;z-index:10;white-space:pre-wrap}
#xr-canvas{position:fixed;width:100vw;height:100vh;left:0;top:0;opacity:1;pointer-events:none;z-index:-1}
</style>
</head>
<body>
<div id="controls">
  <button id="vr" class="control" type="button">VR</button>
  <button id="reset" class="control" type="button" aria-label="Reset simulation">R</button>
</div>
<div id="stage"><canvas id="preview"></canvas></div>
<canvas id="xr-canvas" aria-hidden="true"></canvas>
<div id="status" aria-live="polite"></div>

<script src="simulation.js"></script>
<script src="renderer.js"></script>
<script>
(() => {
  "use strict";

  const stage = document.getElementById("stage");
  const canvas = document.getElementById("preview");
  const context = canvas.getContext("2d", { alpha: false });
  const resetButton = document.getElementById("reset");
  const vrButton = document.getElementById("vr");
  const status = document.getElementById("status");
  const xrCanvas = document.getElementById("xr-canvas");

  if (!stage || !canvas || !context || !resetButton || !vrButton || !status || !xrCanvas) {
    throw new Error("VR preview UI failed to initialize.");
  }

  if (!window.VRWorld || !window.VRRenderer || !window.VRWorldColors) {
    status.textContent = "VR preview failed: required project scripts did not load.";
    throw new Error("VRWorld, VRRenderer, or VRWorldColors is missing.");
  }

  const world = window.VRWorld;
  const renderer = new window.VRRenderer(xrCanvas, world);
  const colors = window.VRWorldColors;

  let lastTime = performance.now();
  let initialized = false;
  let viewWidth = 0;
  let viewHeight = 0;
  let resizeQueued = false;
  let nextPeriodicSave = 5;
  let vrStarting = false;

  const normalizeColor = color => {
    const match = /^#([0-9a-f]{8})$/i.exec(color || "");
    if (!match) return color;

    const hex = match[1];
    const red = parseInt(hex.slice(0, 2), 16);
    const green = parseInt(hex.slice(2, 4), 16);
    const blue = parseInt(hex.slice(4, 6), 16);
    const alpha = parseInt(hex.slice(6, 8), 16) / 255;

    return "rgba(" + red + "," + green + "," + blue + "," + alpha + ")";
  };

  const drawColors = {
    meta: normalizeColor(colors.meta),
    spike: normalizeColor(colors.spike),
    glitch: normalizeColor(colors.glitch)
  };

  const getStorage = () => {
    try {
      return window.localStorage;
    } catch {
      return null;
    }
  };

  const saveWorld = () => {
    const storage = getStorage();
    if (storage) world.savePersistence(storage);
  };

  const resizeXRCanvas = () => {
    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    xrCanvas.width = Math.max(1, Math.round(window.innerWidth * pixelRatio));
    xrCanvas.height = Math.max(1, Math.round(window.innerHeight * pixelRatio));
  };

  const resize = () => {
    resizeXRCanvas();
    const rect = stage.getBoundingClientRect();
    const width = Math.max(0, rect.width);
    const height = Math.max(0, rect.height);

    if (width < 1 || height < 1) return false;

    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    const pixelWidth = Math.max(1, Math.round(width * pixelRatio));
    const pixelHeight = Math.max(1, Math.round(height * pixelRatio));

    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }

    viewWidth = width;
    viewHeight = height;
    context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    world.setBounds(width, height);

    return true;
  };

  const requestResize = () => {
    resizeXRCanvas();
    if (resizeQueued) return;

    resizeQueued = true;
    requestAnimationFrame(() => {
      resizeQueued = false;
      resize();
    });
  };

  const drawCircle = (entity, color) => {
    context.beginPath();
    context.arc(entity.x, entity.y, Math.max(0, entity.radius), 0, Math.PI * 2);
    context.fillStyle = color;
    context.fill();
  };

  const drawSpike = entity => {
    const count = Math.min(32, Math.max(3, world.spikePointCount(entity)));
    const radius = Math.max(0, entity.radius);
    const direction = Number.isFinite(entity.direction) ? entity.direction : 0;

    context.beginPath();

    for (let i = 0; i < count; i += 1) {
      const angle = direction + Math.PI * 2 * i / count;
      const x = entity.x + Math.cos(angle) * radius;
      const y = entity.y + Math.sin(angle) * radius;

      if (i === 0) context.moveTo(x, y);
      else context.lineTo(x, y);
    }

    context.closePath();
    context.fillStyle = drawColors.spike;
    context.fill();
  };

  const drawMetaball = entity => {
    drawCircle(entity, drawColors.meta);

    if (entity.pickup && entity.pickup.storedXp > 0) {
      context.beginPath();
      context.arc(
        entity.x,
        entity.y,
        Math.max(3, entity.radius * 0.32),
        0,
        Math.PI * 2
      );
      context.fillStyle = "#000";
      context.fill();
    }
  };

  const drawPlayer = () => {
    const player = world.player;
    if (!player) return;

    const size = Math.max(7, player.radius * 0.7);
    const heading = Number.isFinite(player.head && player.head.yaw)
      ? player.head.yaw
      : 0;

    context.save();
    context.translate(player.x, player.y);
    context.rotate(heading);
    context.beginPath();
    context.moveTo(0, -size);
    context.lineTo(size, 0);
    context.lineTo(0, size);
    context.lineTo(-size, 0);
    context.closePath();
    context.fillStyle = "#3b82f6";
    context.fill();
    context.restore();

    context.fillStyle = "#fff";
    context.font = "700 12px monospace";
    context.textAlign = "center";
    context.textBaseline = "bottom";
    context.fillText(String(player.xp), player.x, player.y - size - 4);
  };

  const drawPlayerTrap = () => {
    const trap = world.player && world.player.trap;
    if (!trap || !trap.active) return;

    context.fillStyle = "rgba(0,0,0,.94)";
    context.fillRect(0, 0, viewWidth, viewHeight);

    context.save();
    context.lineWidth = 2;
    context.shadowBlur = 12;
    context.shadowColor = "#fff";
    context.strokeStyle = "#fff";
    context.fillStyle = "#fff";

    for (const point of trap.points) {
      context.beginPath();
      context.moveTo(point.x, point.y);
      context.lineTo(trap.center.x, trap.center.y);
      context.stroke();

      context.beginPath();
      context.arc(point.x, point.y, point.sealed ? 4 : 3, 0, Math.PI * 2);
      context.fill();
    }

    context.beginPath();
    context.arc(trap.center.x, trap.center.y, 6, 0, Math.PI * 2);
    context.fill();
    context.restore();

    context.fillStyle = "#fff";
    context.font = "700 12px monospace";
    context.textAlign = "center";
    context.textBaseline = "top";
    context.fillText(
      "REPAIR",
      trap.center.x,
      Math.min(viewHeight - 14, trap.center.y + 14)
    );
  };

  const draw = () => {
    if (viewWidth < 1 || viewHeight < 1) return;

    context.clearRect(0, 0, viewWidth, viewHeight);
    context.fillStyle = "#111";
    context.fillRect(0, 0, viewWidth, viewHeight);

    for (const entity of world.metaballs) drawMetaball(entity);
    for (const entity of world.spikes) drawSpike(entity);
    for (const entity of world.glitches) drawCircle(entity, drawColors.glitch);

    drawPlayer();

    if (world.player && world.player.captured) drawPlayerTrap();
  };

  const resetSimulation = () => {
    const storage = getStorage();

    if (storage) world.clearPersistence(storage);
    world.resetPrototypeWorld();
    world.persistence.majorDirty = true;
    saveWorld();

    nextPeriodicSave = Math.floor(world.worldTime / 5 + 1) * 5;
    lastTime = performance.now();
    status.textContent = "Simulation reset.";
  };

  const initialize = () => {
    if (initialized) return true;
    if (!resize()) return false;

    // A page load always starts a clean prototype. This deliberately clears
    // any stale localStorage snapshot before the first simulation frame.
    const storage = getStorage();
    if (storage) world.clearPersistence(storage);

    world.resetPrototypeWorld();
    world.persistence.majorDirty = true;

    initialized = true;
    nextPeriodicSave = Math.floor(world.worldTime / 5 + 1) * 5;
    return true;
  };

  const updateWebXRStatus = async () => {
    if (!window.isSecureContext) {
      status.textContent = "Desktop preview active. WebXR requires HTTPS.";
      return;
    }

    if (!navigator.xr || typeof navigator.xr.isSessionSupported !== "function") {
      status.textContent = "Desktop preview active. WebXR is not available in this browser.";
      return;
    }

    try {
      const supported = await navigator.xr.isSessionSupported("immersive-vr");
      status.textContent = supported
        ? "Desktop preview active. WebXR is ready."
        : "Desktop preview active. No immersive VR device is available to this browser.";
    } catch (error) {
      status.textContent = "Desktop preview active. WebXR support check failed.";
      console.warn("WebXR support check failed:", error);
    }
  };

  const startOrStopVR = async () => {
    if (vrStarting) return;

    if (renderer.isActive) {
      await renderer.stop();
      vrButton.textContent = "VR";
      status.textContent = "Returned to desktop preview.";
      return;
    }

    vrStarting = true;
    vrButton.disabled = true;
    status.textContent = "Starting WebXR...";

    try {
      await renderer.start();
      vrButton.textContent = "EXIT VR";
      status.textContent = "WebXR active. Exit VR from the headset or press EXIT VR.";
    } catch (error) {
      status.textContent = "VR unavailable: " + String(error && error.message || error);
      console.warn("WebXR startup failed:", error);
    } finally {
      vrStarting = false;
      vrButton.disabled = false;
    }
  };

  const loop = now => {
    if (!initialized) initialize();

    const delta = Math.max(0, (now - lastTime) / 1000);
    lastTime = now;

    if (initialized && !renderer.isActive) {
      world.step(delta);

      if (world.persistence.majorDirty || world.worldTime >= nextPeriodicSave) {
        saveWorld();
        nextPeriodicSave = Math.floor(world.worldTime / 5 + 1) * 5;
      }
    }

    if (!renderer.isActive && renderer.error) {
      status.textContent = "Last VR renderer error: " + renderer.error;
    }

    draw();
    requestAnimationFrame(loop);
  };

  resetButton.addEventListener("click", resetSimulation);
  vrButton.addEventListener("click", startOrStopVR);
  window.addEventListener("resize", requestResize);
  if ("ResizeObserver" in window) {
    new ResizeObserver(requestResize).observe(stage);
  }

  initialize();
  resizeXRCanvas();
  updateWebXRStatus();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
