<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>VR World Preview</title><style>html,body{margin:0;width:100%;height:100%;background:#080808;overflow:hidden}body{display:grid;place-items:center}#stage{width:min(82vmin,720px);height:min(82vmin,720px);background:#111;border:2px solid #666;border-radius:12px;overflow:hidden}canvas{width:100%;height:100%;display:block}</style></head><body><div id="stage"><canvas id="preview"></canvas></div><script src="../state.js"></script><script src="simulation.js"></script><script>(function(){const c=document.getElementById("preview"),x=c.getContext("2d"),w=window.VRWorld;const items=[["meta",.27,.35],["spike",.52,.62],["glitch",.74,.38]];function size(){const d=Math.min(devicePixelRatio||1,2),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0)}function draw(){const W=c.clientWidth,H=c.clientHeight,s=Math.min(W,H)*.07;x.clearRect(0,0,W,H);x.fillStyle="#111";x.fillRect(0,0,W,H);for(let i=0;i<items.length;i++){const o=items[i],px=o[1]*W,py=o[2]*H;x.fillStyle=o[0]==="meta"?"#ffe500":"#ff3030";x.beginPath();if(o[0]==="meta")x.arc(px,py,s,0,Math.PI*2);else if(o[0]==="spike"){x.moveTo(px,py-s);x.lineTo(px+s,py+s);x.lineTo(px-s,py+s);x.closePath()}else x.rect(px-s,py-s,s*2,s*2);x.fill()}}function loop(t){w.advanceTime(1/60);draw();requestAnimationFrame(loop)}addEventListener("resize",size);size();requestAnimationFrame(loop)})()</script></body></html>
