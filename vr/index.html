<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VR World Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
body{display:grid;place-items:center}
#stage{width:min(82vmin,720px);height:min(82vmin,720px);background:#111;border:2px solid #666;border-radius:12px;position:relative;overflow:hidden;box-sizing:border-box}
canvas{width:100%;height:100%;display:block}
#label{position:fixed;left:12px;top:10px;font-size:13px;opacity:.65;pointer-events:none}
</style>
</head>
<body>
<div id="label">VR world preview</div>
<div id="stage"><canvas id="preview"></canvas></div>
<script src="../state.js"></script>
<script src="simulation.js"></script>
<script>
(function(){
  const canvas=document.getElementById('preview');
  const ctx=canvas.getContext('2d');
  const world=window.VRWorld;
  const player=world.player;
  const colors={meta:'#ffe500',spike:'#ff3030',glitch:'#ff3030',player:'#348cff'};
  const objects=[
    {id:'meta-preview',type:'metaball',x:.27,y:.35},
    {id:'spike-preview',type:'spike',x:.52,y:.62},
    {id:'glitch-preview',type:'glitch',x:.74,y:.38}
  ];
  let last=performance.now();
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const r=canvas.getBoundingClientRect();
    canvas.width=Math.max(1,Math.round(r.width*dpr));
    canvas.height=Math.max(1,Math.round(r.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function draw(){
    const w=canvas.clientWidth,h=canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle='#111';ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;
    for(let x=24;x<w;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
    for(let y=24;y<h;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
    for(const o of objects){
      const x=o.x*w,y=o.y*h,s=Math.max(24,Math.min(w,h)*.07);
      ctx.fillStyle=colors[o.type];
      ctx.beginPath();
      if(o.type==='metaball') ctx.arc(x,y,s,0,Math.PI*2);
      else if(o.type==='spike'){ctx.moveTo(x,y-s);ctx.lineTo(x+s,y+s);ctx.lineTo(x-s,y+s);ctx.closePath()}
      else ctx.rect(x-s,y-s,s*2,s*2);
      ctx.fill();
    }
  }
  function frame(now){
    const dt=Math.min(.1,Math.max(0,(now-last)/1000)); last=now;
    world.advanceTime(dt);
    draw();
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize',resize);
  resize();
  draw();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
