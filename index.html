<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Animated Metaballs</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}
#error{position:fixed;inset:0;display:none;place-items:center;padding:24px;box-sizing:border-box;color:#fff;background:#000;font:16px/1.5 Arial,sans-serif;text-align:center}
</style>
</head>
<body>
<canvas id="canvas"></canvas><div id="error"></div>
<script>
(function(){
"use strict";
var canvas=document.getElementById("canvas"),error=document.getElementById("error");
var ctx=canvas.getContext("2d",{alpha:false});
if(!ctx){error.style.display="grid";error.textContent="This browser does not support HTML5 Canvas.";return;}

var BALL_COUNT=4;
var colors=[[0,255,199],[255,237,0],[255,0,84],[0,0,0]];
var balls=[],renderWidth=320,renderHeight=180,viewWidth=1,viewHeight=1,scaleX=1,scaleY=1;
var lastTime=0,activeBall=-1,imageData,pixels;

function direction(speed){var a=Math.random()*Math.PI*2;return{x:Math.cos(a)*speed,y:Math.sin(a)*speed};}
for(var i=0;i<BALL_COUNT;i++)balls.push({x:0,y:0,vx:0,vy:0,radius:50,speed:70,color:colors[i],dragging:false});

function resize(){
 viewWidth=Math.max(1,window.innerWidth||document.documentElement.clientWidth||1);
 viewHeight=Math.max(1,window.innerHeight||document.documentElement.clientHeight||1);
 var longest=Math.max(viewWidth,viewHeight),s=Math.min(1,320/longest);
 renderWidth=Math.max(120,Math.round(viewWidth*s));
 renderHeight=Math.max(80,Math.round(viewHeight*s));
 if(canvas.width!==renderWidth||canvas.height!==renderHeight){
  canvas.width=renderWidth;canvas.height=renderHeight;
  imageData=ctx.createImageData(renderWidth,renderHeight);pixels=imageData.data;
 }
 scaleX=renderWidth/viewWidth;scaleY=renderHeight/viewHeight;
 for(var j=0;j<balls.length;j++){
  var b=balls[j];b.radius=Math.max(22,Math.min(viewWidth,viewHeight)*.12);
  if(!isFinite(b.x)||!isFinite(b.y)){b.x=viewWidth*(.25+j*.17);b.y=viewHeight*(.35+(j%2)*.3);}
  b.x=Math.max(b.radius,Math.min(viewWidth-b.radius,b.x));
  b.y=Math.max(b.radius,Math.min(viewHeight-b.radius,b.y));
 }
}
function place(){
 var p=[[.27,.36],[.73,.36],[.32,.70],[.68,.70]];
 for(var i=0;i<balls.length;i++){balls[i].x=viewWidth*p[i][0];balls[i].y=viewHeight*p[i][1];var d=direction(balls[i].speed);balls[i].vx=d.x;balls[i].vy=d.y;}
}
function update(dt){
 for(var i=0;i<balls.length;i++){var b=balls[i];if(b.dragging)continue;
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x-b.radius<=0){b.x=b.radius;b.vx=Math.abs(b.vx)}else if(b.x+b.radius>=viewWidth){b.x=viewWidth-b.radius;b.vx=-Math.abs(b.vx)}
  if(b.y-b.radius<=0){b.y=b.radius;b.vy=Math.abs(b.vy)}else if(b.y+b.radius>=viewHeight){b.y=viewHeight-b.radius;b.vy=-Math.abs(b.vy)}
 }
}
function draw(){
 var w=renderWidth,h=renderHeight,d=pixels,idx=0;
 for(var py=0;py<h;py++){var wy=py/scaleY;
  for(var px=0;px<w;px++){var wx=px/scaleX,total=0,r=0,g=0,bl=0;
   for(var k=0;k<BALL_COUNT;k++){var b=balls[k],dx=wx-b.x,dy=wy-b.y,inf=(b.radius*b.radius)/Math.max(dx*dx+dy*dy,1);total+=inf;r+=b.color[0]*inf;g+=b.color[1]*inf;bl+=b.color[2]*inf;}
   if(total>1.05){d[idx]=Math.min(255,r/total);d[idx+1]=Math.min(255,g/total);d[idx+2]=Math.min(255,bl/total)}else{d[idx]=0;d[idx+1]=0;d[idx+2]=0}
   d[idx+3]=255;idx+=4;
  }
 }
 ctx.putImageData(imageData,0,0);
}
function pos(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*viewWidth,y:(e.clientY-r.top)/r.height*viewHeight};}
function down(e){var p=pos(e);for(var i=balls.length-1;i>=0;i--){var b=balls[i],dx=p.x-b.x,dy=p.y-b.y;if(dx*dx+dy*dy<=b.radius*b.radius){activeBall=i;b.dragging=true;b.x=p.x;b.y=p.y;if(canvas.setPointerCapture)try{canvas.setPointerCapture(e.pointerId)}catch(x){}break;}}}
function move(e){if(activeBall<0)return;var p=pos(e),b=balls[activeBall];b.vx=(p.x-b.x)*8;b.vy=(p.y-b.y)*8;b.x=p.x;b.y=p.y;}
function up(e){if(activeBall<0)return;balls[activeBall].dragging=false;if(canvas.releasePointerCapture)try{canvas.releasePointerCapture(e.pointerId)}catch(x){}activeBall=-1;}
function frame(t){if(!lastTime)lastTime=t;var dt=Math.min((t-lastTime)/1000,.05);lastTime=t;update(dt);draw();if(window.requestAnimationFrame)window.requestAnimationFrame(frame);else window.setTimeout(function(){frame(new Date().getTime())},33);}
window.addEventListener("resize",resize,false);
if(window.PointerEvent){canvas.addEventListener("pointerdown",down,false);canvas.addEventListener("pointermove",move,false);canvas.addEventListener("pointerup",up,false);canvas.addEventListener("pointercancel",up,false)}
else{canvas.addEventListener("mousedown",down,false);canvas.addEventListener("mousemove",move,false);canvas.addEventListener("mouseup",up,false);canvas.addEventListener("touchstart",function(e){if(e.touches.length)down(e.touches[0]);e.preventDefault()},false);canvas.addEventListener("touchmove",function(e){if(e.touches.length)move(e.touches[0]);e.preventDefault()},false);canvas.addEventListener("touchend",function(e){up(e.changedTouches[0]||e);e.preventDefault()},false);}
resize();place();draw();
if(window.requestAnimationFrame)window.requestAnimationFrame(frame);else window.setTimeout(function(){frame(new Date().getTime())},33);
})();
</script>
</body>
</html>
