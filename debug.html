<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balls Debug</title>
    <style>
        :root { color-scheme: dark; }
        html, body {
            margin: 0;
            min-height: 100%;
            background: #080808;
            color: #ddd;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        body { padding: 24px; box-sizing: border-box; }
        h1 { margin: 0 0 18px; font-size: 22px; }
        #status { color: #999; margin-bottom: 18px; }
        .section {
            border: 1px solid #555;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            background: #111;
        }
        .section h2 { margin: 0 0 10px; font-size: 15px; color: #aaa; }
        pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }
        .live { color: #9cff00; }
        .stale { color: #ff9d9d; }
        button {
            border: 1px solid #666;
            border-radius: 8px;
            background: #151515;
            color: #ddd;
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Balls World Debug</h1>
    <div id="status">Waiting for world-state data…</div>

    <div class="section">
        <h2>Diamond</h2>
        <pre id="diamond">No data</pre>
    </div>

    <div class="section">
        <h2>Camera</h2>
        <pre id="camera">No data</pre>
    </div>

    <div class="section">
        <h2>Metaballs</h2>
        <pre id="metaballs">No data</pre>
    </div>

    <div class="section">
        <h2>Spike Balls</h2>
        <pre id="spikes">No data</pre>
    </div>

    <div class="section">
        <h2>Glitch Balls</h2>
        <pre id="glitches">No data</pre>
    </div>

    <div class="section">
        <h2>Glitched Substances</h2>
        <pre id="glitched-substances">No data</pre>
    </div>

    <div class="section">
        <h2>Raw Record</h2>
        <button id="copy-record" type="button">Copy JSON</button>
        <pre id="raw">No data</pre>
    </div>

    <script src="state.js"></script>
    <script>
        const status = document.getElementById('status');
        const diamond = document.getElementById('diamond');
        const camera = document.getElementById('camera');
        const metaballs = document.getElementById('metaballs');
        const spikes = document.getElementById('spikes');
        const glitches = document.getElementById('glitches');
        const glitchedSubstances = document.getElementById('glitched-substances');
        const raw = document.getElementById('raw');
        let latestState = null;

        function render(state) {
            if (!state) return;
            latestState = state;

            status.className = 'live';
            status.textContent =
                'LIVE • ' + new Date(state.time).toLocaleTimeString() +
                ' • ' + state.metaballs.length + ' metaballs • ' +
                state.spikeBalls.length + ' spike balls';

            diamond.textContent = JSON.stringify(state.diamond, null, 2);
            camera.textContent = JSON.stringify(state.camera, null, 2);
            metaballs.textContent = JSON.stringify(state.metaballs, null, 2);
            spikes.textContent = JSON.stringify(state.spikeBalls, null, 2);
            glitches.textContent = JSON.stringify(state.glitchBalls ?? [], null, 2);
            glitchedSubstances.textContent = JSON.stringify(state.glitchedSubstances ?? [], null, 2);
            raw.textContent = JSON.stringify(state, null, 2);
        }

        render(WorldStateBridge.getLastSnapshot());
        WorldStateBridge.subscribe(render);

        document.getElementById('copy-record').addEventListener('click', async () => {
            if (!latestState) return;
            await navigator.clipboard?.writeText(JSON.stringify(latestState, null, 2));
        });
    </script>
</body>
</html>
